[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "portallens"
version = "0.1.0"
description = "PortalLens — Intelligence and security analysis for digital portals (captive Wi-Fi first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tisone K", email = "TisoneK@users.noreply.github.com" }]
keywords = ["captive-portal", "wifi", "mikrotik", "ispman", "fingerprinting", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Internet",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
portallens = "portallens.cli:main"

[project.urls]
Homepage = "https://github.com/TisoneK/PortalLens"
Repository = "https://github.com/TisoneK/PortalLens"

[tool.hatch.build.targets.wheel]
packages = ["src/portallens"]

[tool.hatch.build.targets.sdist]
include = ["src/portallens", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: tests that hit the network (skipped by default; run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line length is enforced by formatter, not linter
  "RUF001", # ambiguous unicode — we use EN DASH (–) intentionally for ranges
  "RUF002", # ambiguous unicode in docstrings — same
  "RUF003", # ambiguous unicode in comments — same
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/portallens"]
